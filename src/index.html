<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOOPS</title>

    <link rel="stylesheet" href="/src/css/app.css">
    <link rel="stylesheet" href="/src/css/sports-arena.css">
</head>

<body>

    <main id="app">

        <section class="game-menu">
            
            <button class="game-card" data-game="thirty-second-shootout">
                <strong>30 SECOND SHOOTOUT</strong>
                <span>Score as many as you can</span>
            </button>

            <button class="game-card" data-game="connect3hoops">
                <strong>CONNECT 3 HOOPS</strong>
                <span>Get three in a row</span>
            </button>

            <button class="game-card" data-game="connect4hoops">
                <strong>CONNECT 4 HOOPS</strong>
                <span>Get four in a row</span>
            </button>

        </section>

        <section id="game-area" hidden>
            <button id="back-to-menu">← BACK TO GAMES</button>
        
            <div id="game-container"></div>
        </section>

    </main>

    <script type="module" src="/src/js/app.js"></script>

</body>
</html>
