<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOOPS</title>

    <link rel="stylesheet" href="/src/css/app.css">
    <link rel="stylesheet" href="/src/css/sports-arena.css">
    <link rel="stylesheet" href="/src/css/hoops-of-war.css">
    <link rel="stylesheet" href="/src/css/head-to-head-shootout.css">
</head>

<body>

    <main id="app">

        <section class="game-menu">

            <button class="game-card" data-game="head-to-head-shootout">
                <strong>Head to Head Shootout</strong>
                <span>Score as many as you can</span>
            </button>

            <button class="game-card" data-game="hoops-of-war">
                <strong>Hoops of War</strong>
                <span>Pull the rope</span>
            </button>

            <button class="game-card" data-game="thirty-second-shootout">
                <strong>30 Second Shootout</strong>
                <span>Score as many as you can</span>
            </button>

            <button class="game-card" data-game="connect3hoops">
                <strong>Connect 3 Hoops</strong>
                <span>Get three in a row</span>
            </button>

        </section>

        <section id="game-area" hidden>     
            <div id="game-container"></div>
        </section>

    </main>

    <script type="module" src="/src/js/app.js"></script>

</body>
</html>
